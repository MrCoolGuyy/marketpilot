# ┌───────────────────────────────────────────────────────────┐
# │              MarketPilot — Default Settings              │
# └───────────────────────────────────────────────────────────┘
#
# This file provides default / template values.
# Secrets (API keys) should NEVER be placed here — use .env instead.
#
# Environment variable interpolation is supported:
#   ${ENV_VAR}          — required (left as-is if missing)
#   ${ENV_VAR:default}  — with fallback

app_name: MarketPilot
debug: false

exchange:
  testnet: true
  rate_limit: 10
  order_rate_limit: 10
  timeout: 10
  max_retries: 3
  retry_backoff: 1.5

storage:
  url: "sqlite+aiosqlite:///data/marketpilot.db"
  pool_size: 5
  max_overflow: 10
  pool_recycle: 3600
  echo: false

logging:
  level: INFO
  rotation: "10 MB"
  retention: "7 days"
  log_dir: logs
