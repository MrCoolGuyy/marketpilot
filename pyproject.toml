[project]
name = "marketpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irfan", email = "nurahmadiharis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "loguru>=0.7.3",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pybit>=5.17.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
]

[project.scripts]
marketpilot = "marketpilot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
