[project]
name = "marketpilot"
version = "0.1.0"
description = "Multi-asset trading bot framework for Bybit exchange"
readme = "README.md"
authors = [
    { name = "Irfan", email = "nurahmadiharis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "apscheduler>=3.11.3",
    "loguru>=0.7.3",
    "pybit>=5.17.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
research = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
marketpilot = "marketpilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["quarantine"]

